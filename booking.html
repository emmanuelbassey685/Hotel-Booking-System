<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rexona Hotel & Suite | Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/styles.css"><link rel="stylesheet" href="/src/css/booking.css"><link rel="stylesheet" href="/src/css/responsive.css">
</head>
<body data-page="booking">
<header id="site-header"></header>
<main>
  <section class="page-banner"><div class="container"><p class="eyebrow">RESERVATION</p><h1>Complete your booking</h1><p>Enter your details and review the reservation before payment.</p></div></section>
  <section class="container section booking-layout">
    <form id="booking-form" class="form-card">
      <input id="booking-room-id" type="hidden">
      <h2>Guest Information</h2>
      <div class="form-grid">
        <label>Full Name<input id="guest-name" type="text" required minlength="2"></label>
        <label>Email<input id="guest-email" type="email" required></label>
        <label>Phone<input id="guest-phone" type="tel" required></label>
        <label>Guests<input id="booking-guests" type="number" min="1" max="8" value="2" required></label>
        <label>Check-in<input id="booking-checkin" type="date" required></label>
        <label>Check-out<input id="booking-checkout" type="date" required></label>
        <label class="full">Special Request<textarea id="special-request" rows="4" placeholder="Optional"></textarea></label>
      </div>
      <p id="booking-error" class="form-error" role="alert"></p>
      <button class="btn btn-primary" type="submit">Proceed to Payment</button>
    </form>
    <aside id="booking-summary" class="summary-card"></aside>
  </section>
</main>
<footer id="site-footer"></footer>
<script type="module" src="/src/js/main.js"></script>
</body>
</html>
